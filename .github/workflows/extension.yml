name: Build and publish extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run package
      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: pareto-ghc-comparator-${{ github.sha }}
          path: pareto-ghc-comparator.vsix
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to VS Code Marketplace
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: pareto-ghc-comparator-${{ github.sha }}
          path: release
      - name: Publish tested VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Configure the VSCE_PAT secret for the marketplace environment or repository."
            exit 1
          fi
          npx --no-install vsce publish --packagePath release/pareto-ghc-comparator.vsix
