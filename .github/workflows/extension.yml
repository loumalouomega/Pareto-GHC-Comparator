name: Build and publish extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run package
      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: pareto-ghc-comparator-${{ github.sha }}
          path: pareto-ghc-comparator.vsix
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: github-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pareto-ghc-comparator-${{ github.sha }}
          path: release
      - name: Publish VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          VERSION="${TAG#v}"
          SRC="release/pareto-ghc-comparator.vsix"
          ASSET="pareto-ghc-comparator-${VERSION}.vsix"
          ls -lh "$SRC"
          cp "$SRC" "$ASSET"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading $ASSET."
            gh release upload "$TAG" "$ASSET" --clobber --repo "$REPO"
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$REPO" \
              --title "$TAG" \
              --target "$GITHUB_SHA" \
              --notes "## $TAG

          Tested VSIX built in CI (type-check, unit/host tests, Chromium UI tests) from tag \`$TAG\`.

          ### Manual install
          1. Download \`$ASSET\` below.
          2. In VS Code: **Extensions: Install from VSIX…** and select the file.
          3. Run **Pareto GHC: Open Model Comparison** from the Command Palette."
          fi

  publish:
    name: Publish to VS Code Marketplace
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: pareto-ghc-comparator-${{ github.sha }}
          path: release
      - name: Publish tested VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          VSIX="release/pareto-ghc-comparator.vsix"
          PUBLISHER="$(node -p "require('./package.json').publisher")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "Publisher: $PUBLISHER, version: $VERSION"
          ls -lh "$VSIX"
          AUTH_ARGS=()
          if [ -n "${VSCE_PAT:-}" ]; then
            # Don't leak the token; only show its length to distinguish empty/whitespace vs invalid.
            echo "VSCE_PAT present (length ${#VSCE_PAT}). Verifying publish rights for '$PUBLISHER'..."
            # NOTE: the publisher is a positional argument. Passing it with -p/--pat
            # sends the publisher ID as the token and always fails with
            # TF400813 (user 'aaaaaaaa-...'). The PAT is read from VSCE_PAT env.
            npx --no-install vsce verify-pat "$PUBLISHER"
          else
            echo "VSCE_PAT is empty; trying Microsoft Entra ID (--azure-credential)."
            echo "::notice::To use PAT auth, set VSCE_PAT as an environment secret on the 'marketplace' environment (environment secrets override repository secrets). See https://code.visualstudio.com/api/working-with-extensions/publishing-extension#personal-access-token"
            AUTH_ARGS=(--azure-credential)
            npx --no-install vsce verify-pat --azure-credential "$PUBLISHER"
          fi
          npx --no-install vsce publish --packagePath "$VSIX" "${AUTH_ARGS[@]}" --skip-duplicate
